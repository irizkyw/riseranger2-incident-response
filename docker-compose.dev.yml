services:
  postgres:
    image: postgres:16-alpine
    container_name: riseranger-dev-postgres
    restart: always
    environment:
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: ctf_password
      POSTGRES_DB: ctf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - ctf-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: riseranger-dev-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ctf-dev-network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: riseranger-dev-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "postgresql://ctf_user:ctf_password@postgres:5432/ctf_db?schema=public"
      JWT_ACCESS_SECRET: "rise_ranger_dev_access_secret_2026"
      JWT_REFRESH_SECRET: "rise_ranger_dev_refresh_secret_2026"
      CLIENT_URL: "http://localhost:5173,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      DB_SEED: "true"
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    command: ["bun", "--watch", "src/index.ts"]
    networks:
      - ctf-dev-network

volumes:
  postgres_dev_data:
    name: riseranger_dev_postgres_data

networks:
  ctf-dev-network:
    name: riseranger-dev-network
    driver: bridge
