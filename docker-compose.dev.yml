services:
  mysql:
    image: mysql:8.0
    container_name: riseranger-dev-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ctf_db
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: ctf_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - ctf-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: riseranger-dev-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ctf-dev-network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: riseranger-dev-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: "mysql://ctf_user:ctf_password@mysql:3306/ctf_db"
      JWT_ACCESS_SECRET: "rise_ranger_dev_access_secret_2026"
      JWT_REFRESH_SECRET: "rise_ranger_dev_refresh_secret_2026"
      CLIENT_URL: "http://localhost:5173,http://127.0.0.1:5173"
      REDIS_URL: "redis://redis:6379"
      DB_SEED: "true"
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    command: ["bun", "--watch", "src/index.ts"]
    networks:
      - ctf-dev-network

volumes:
  mysql_dev_data:

networks:
  ctf-dev-network:
    driver: bridge
