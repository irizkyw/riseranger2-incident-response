services:
  # ============================================================================
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: riseranger-postgres
    restart: always
    environment:
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: ctf_password
      POSTGRES_DB: ctf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. IN-MEMORY CACHE SERVICE (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: riseranger-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. BACKEND API & WEBSOCKET ENGINE
  # ============================================================================
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: riseranger-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://ctf_user:ctf_password@postgres:5432/ctf_db?schema=public"
      JWT_ACCESS_SECRET: "rise_ranger_docker_production_access_secret_2026"
      JWT_REFRESH_SECRET: "rise_ranger_docker_production_refresh_secret_2026"
      CLIENT_URL: "http://localhost,http://localhost:80,http://127.0.0.1"
      REDIS_URL: "redis://redis:6379"
      DB_SEED: "true" # Otomatis seed data awal pada saat pertama kali container jalan
      MAX_UPLOAD_SIZE_MB: 50
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5001:5000"
    networks:
      - ctf-network

  # ============================================================================
  # 4. FRONTEND SPA & REVERSE PROXY (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: riseranger-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - ctf-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_data:
    name: riseranger_postgres_data
  redis_data:
    name: riseranger_redis_data
  backend_uploads:
    name: riseranger_backend_uploads

networks:
  ctf-network:
    name: riseranger-network
    driver: bridge
