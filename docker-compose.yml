services:
  # ============================================================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: riseranger-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ctf_db
      MYSQL_USER: ctf_user
      MYSQL_PASSWORD: ctf_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. IN-MEMORY CACHE SERVICE (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: riseranger-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. BACKEND API & WEBSOCKET ENGINE
  # ============================================================================
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: riseranger-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://ctf_user:ctf_password@mysql:3306/ctf_db"
      JWT_ACCESS_SECRET: "rise_ranger_docker_production_access_secret_2026"
      JWT_REFRESH_SECRET: "rise_ranger_docker_production_refresh_secret_2026"
      CLIENT_URL: "http://localhost,http://localhost:80,http://127.0.0.1"
      REDIS_URL: "redis://redis:6379"
      DB_SEED: "true" # Otomatis seed data awal pada saat pertama kali container jalan
      MAX_UPLOAD_SIZE_MB: 50
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - ctf-network

  # ============================================================================
  # 4. FRONTEND SPA & REVERSE PROXY (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: riseranger-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ctf-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  mysql_data:
    name: riseranger_mysql_data
  redis_data:
    name: riseranger_redis_data
  backend_uploads:
    name: riseranger_backend_uploads

networks:
  ctf-network:
    name: riseranger-network
    driver: bridge
