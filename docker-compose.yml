services:
  # ============================================================================
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: riseranger-postgres
    restart: always
    environment:
      POSTGRES_USER: ctf_rtr2_user
      POSTGRES_PASSWORD: d64a5b35e72a9f70d372c7e78f58002a09634ddf53dd61d7d881ceb1ff4adadc
      POSTGRES_DB: ctf_rtr2_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ctf_rtr2_user -d ctf_rtr2_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. IN-MEMORY CACHE SERVICE (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: riseranger-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ctf-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. BACKEND API & WEBSOCKET ENGINE
  # ============================================================================
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: riseranger-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://ctf_rtr2_user:d64a5b35e72a9f70d372c7e78f58002a09634ddf53dd61d7d881ceb1ff4adadc@postgres:5432/ctf_rtr2_db?schema=public"
      JWT_ACCESS_SECRET: "6c08d6341ff37c0b8526f09803ba392cd0e44287fe6863c4ef1fb62442e0cca967a991ef48a3ae011929488aeb2a4eddc8a8c21cbbe9bfd41f160f088d61ee14"
      JWT_REFRESH_SECRET: "6c08d6341ff37c0b8526f09803ba392cd0e44287fe6863c4ef1fb62442e0cca967a991ef48a3ae011929488aeb2a4eddc8a8c21cbbe9bfd41f160f088d61ee14"
      CLIENT_URL: "http://localhost,http://localhost:80,http://127.0.0.1"
      REDIS_URL: "redis://redis:6379"
      DB_SEED: "false" # Set true hanya jika ingin inisialisasi awal database kosong
      MAX_UPLOAD_SIZE_MB: 50
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5001:5000"
    networks:
      - ctf-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ============================================================================
  # 4. FRONTEND SPA & REVERSE PROXY (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: riseranger-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - ctf-network

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  postgres_data:
    name: riseranger_postgres_data
  redis_data:
    name: riseranger_redis_data
  backend_uploads:
    name: riseranger_backend_uploads

networks:
  ctf-network:
    name: riseranger-network
    driver: bridge
