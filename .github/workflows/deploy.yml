name: 🚀 RISERANGER 2 — CD Pipeline (Auto Deploy to VPS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy_to_server:
    name: 🌐 Remote Deploy via SSH
    runs-on: ubuntu-latest
    if: github.repository != '' # Aktif saat branch main di-push

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR || '/var/www/riseranger2' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 [CI/CD] Deploying latest updates..."
            cd ${{ secrets.SERVER_TARGET_DIR || '/var/www/riseranger2' }}
            git pull origin main
            docker compose down
            docker compose up -d --build
            echo "✅ [CI/CD] Deployment successful & live!"
