name: 🛡️ RISERANGER 2 — CI Pipeline (Automated Test & Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ============================================================================
  # 1. CODE QUALITY & TYPE CHECK (BACKEND + FRONTEND)
  # ============================================================================
  test_and_build:
    name: ⚡ Test, Lint & Compile Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍞 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Monorepo Dependencies
        run: bun install

      - name: 🗄️ Validate Prisma Schema & Generate Client
        run: |
          cd packages/backend
          bun x prisma generate

      - name: 🔍 Backend TypeScript Verification
        run: |
          cd packages/backend
          bun x tsc --noEmit

      - name: 🖥️ Frontend Production Build Verification
        run: |
          cd packages/frontend
          bun run build

  # ============================================================================
  # 2. DOCKER CONTAINERIZATION VERIFICATION
  # ============================================================================
  docker_build_check:
    name: 🐳 Docker Images Build Test
    runs-on: ubuntu-latest
    needs: test_and_build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Compose Images
        run: |
          docker compose build
